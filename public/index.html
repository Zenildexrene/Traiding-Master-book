<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace vendeur</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#0d1420;--mu:#5d6778;--ac:#e0a21a;--ac2:#0d1420;--bd:#dde1e8;--er:#d6334f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111b;--card:#121b29;--tx:#eef2f7;--mu:#8e9aae;--ac:#f5c242;--ac2:#0a111b;--bd:#223046;--er:#ff6b82}}
:root[data-theme="dark"]{--bg:#0a111b;--card:#121b29;--tx:#eef2f7;--mu:#8e9aae;--ac:#f5c242;--ac2:#0a111b;--bd:#223046;--er:#ff6b82}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 18px 40px}
h1{font:800 30px/1.1 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;font-weight:700;width:100%;margin-top:12px;padding:13px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);cursor:pointer}
button.g{background:none;color:var(--mu);border:1px solid var(--bd);font-weight:500}
.msg{margin-top:10px;font-size:14px;color:var(--mu)}.err{color:var(--er)}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}li:first-child{border-top:0}li span:last-child{color:var(--mu);white-space:nowrap}
.hide{display:none}
</style></head><body><main>
<h1>Manuel de trading</h1>
<p class="s">Espace vendeur : un PDF au nom de chaque client.</p>
<section id="login" class="card">
  <label for="code">Code d'accès</label>
  <input id="code" type="password" autocomplete="current-password">
  <button id="bl">Se connecter</button>
  <div class="msg" id="lm"></div>
</section>
<section id="app" class="hide">
  <div class="card">
    <label for="nom">Nom du client</label>
    <input id="nom" type="text" placeholder="Prénom Nom" autocomplete="off">
    <button id="gen">Générer et télécharger le PDF</button>
    <div class="msg" id="gm"></div>
  </div>
  <div class="card"><label>PDF générés</label><ul id="hist"></ul><div class="msg" id="he">Aucun pour l'instant.</div></div>
  <button class="g" id="out">Se déconnecter</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let CODE='';
try{CODE=sessionStorage.getItem('c')||''}catch(e){}
let hist=[];try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){}
function drawHist(){const u=$('hist');u.innerHTML='';hist.slice().reverse().forEach(h=>{const li=document.createElement('li');const a=document.createElement('span');a.textContent=h.n;const b=document.createElement('span');b.textContent=h.d;li.append(a,b);u.append(li)});$('he').classList.toggle('hide',hist.length>0)}
function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);if(on)drawHist()}
async function call(body){return fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
$('bl').onclick=async()=>{
  const c=$('code').value;const m=$('lm');m.className='msg';m.textContent='Vérification…';
  try{const r=await call({action:'login',code:c});
    if(r.ok){CODE=c;try{sessionStorage.setItem('c',c)}catch(e){}$('code').value='';m.textContent='';show(true)}
    else{const j=await r.json();m.textContent=j.error||'Erreur.';m.className='msg err'}
  }catch(e){m.textContent='Connexion impossible.';m.className='msg err'}};
$('out').onclick=()=>{CODE='';try{sessionStorage.removeItem('c')}catch(e){}show(false)};
$('gen').onclick=async()=>{
  const nom=$('nom').value.trim();const m=$('gm');m.className='msg';
  if(!nom){m.textContent='Entre le nom du client.';m.className='msg err';return}
  m.textContent='Génération en cours…';
  try{const r=await call({code:CODE,nom});
    if(!r.ok){const j=await r.json();m.textContent=j.error||'Erreur.';m.className='msg err';if(r.status===401)show(false);return}
    const blob=await r.blob();const cd=r.headers.get('Content-Disposition')||'';
    const fn=(cd.match(/filename="(.+?)"/)||[])[1]||'Manuel_Trading.pdf';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.append(a);a.click();a.remove();
    hist.push({n:nom,d:new Date().toLocaleDateString('fr-FR')});try{localStorage.setItem('hist',JSON.stringify(hist))}catch(e){}
    drawHist();m.textContent='PDF généré pour '+nom+'.';$('nom').value='';
  }catch(e){m.textContent='Échec de la génération.';m.className='msg err'}};
if(CODE){call({action:'login',code:CODE}).then(r=>{if(r.ok)show(true)})}
</script></body></html>
